# Tests on every push and pull request: Lua specs, pipeline pytest, the
# installer tests (under busybox, as on the Kindle) and the headless
# end-to-end scenarios (make check).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Cache the desktop KOReader
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/koreader
          key: koreader-${{ hashFiles('Makefile') }}
      - name: Busybox (the installer tests run under it)
        run: sudo apt-get install -yq busybox
      - name: Test
        run: make check
      - name: Keep the logs and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e
          path: |
            build/e2e/
            build/test-dist/*.log
